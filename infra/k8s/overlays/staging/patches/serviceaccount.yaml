# Provider annotations are injected by Terraform outputs and the CD pipeline.
# Example for GCP Workload Identity:
#   kubectl annotate sa chitragupt \
#     iam.gke.io/gcp-service-account=chitragupt-staging@PROJECT.iam.gserviceaccount.com
#
# Example for AWS IRSA:
#   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/chitragupt-staging
#
# Example for Azure Workload Identity:
#   azure.workload.identity/client-id: CLIENT_ID
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chitragupt
  namespace: chitragupt
  annotations:
    placeholder: "set-by-cd-pipeline"
