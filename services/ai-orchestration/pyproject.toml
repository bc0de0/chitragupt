[project]
name = "ai-orchestration"
version = "0.1.0"
description = "Chitragupt AI Orchestration Service — LangGraph pipeline, RAG, ingestion"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "langgraph>=0.2",
    # LLM providers
    "anthropic>=0.40",
    "openai>=1.50",
    "voyageai>=0.3",
    "google-generativeai>=0.8",
    # Data / async DB
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # Cache
    "redis[hiredis]>=5.0",
    # Config + validation
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    # Retry
    "tenacity>=9.0",
    # Document parsing
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # Retrieval
    "rank-bm25>=0.2",
    # Object storage
    "boto3>=1.35",
    # PII
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # gRPC server
    "grpcio>=1.67",
    "grpcio-tools>=1.67",
    # Observability
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-grpc>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.6",
    "types-pyyaml",
    "types-redis",
    "types-boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_orchestration"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "fast: unit + mocked-integration tests — no API keys or Docker required (default CI gate)",
    "integration: requires Docker Compose (PostgreSQL, Redis, gRPC services)",
    "quality: requires real LLM API keys — runs on schedule, not in CI",
    "latency: requires warm Docker Compose stack + API keys — runs pre-release",
    "e2e: full end-to-end tests — requires complete Docker Compose stack + API keys",
]

[tool.ruff]
line-length = 100
target-version = "py311"
