apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-machine
  namespace: chitragupt
  labels:
    app.kubernetes.io/name: state-machine
    app.kubernetes.io/component: kernel
    app.kubernetes.io/part-of: chitragupt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: state-machine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: state-machine
        app.kubernetes.io/name: state-machine
    spec:
      serviceAccountName: chitragupt
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      containers:
        - name: state-machine
          image: state-machine:latest  # replaced by kustomize overlay
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: chitragupt-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chitragupt-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chitragupt-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "timeout 2 bash -c '</dev/tcp/localhost/50051'"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "timeout 2 bash -c '</dev/tcp/localhost/50051'"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: state-machine
                topologyKey: kubernetes.io/hostname
