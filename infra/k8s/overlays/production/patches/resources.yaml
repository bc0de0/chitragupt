apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-machine
  namespace: chitragupt
spec:
  template:
    spec:
      containers:
        - name: state-machine
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestration
  namespace: chitragupt
spec:
  template:
    spec:
      containers:
        - name: ai-orchestration
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: chitragupt
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
