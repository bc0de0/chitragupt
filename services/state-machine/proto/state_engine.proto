syntax = "proto3";

package chitragupt.state;

option go_package = "github.com/bc0de0/chitragupt/services/api-gateway/proto/state";

import "common.proto";

// StateEngine — gRPC service exposed by the Rust state machine kernel.
// The Go API gateway is the sole client.
//
// Design: Go orchestrates both Rust (state) and Python (AI pipeline).
//   1. Go → Rust: CreateSession or GetSessionState
//   2. Go → Python: RunPipeline (streaming tokens)
//   3. Go → Rust: ApplyTurnResult (entities + AC updates from pipeline)
//   4. Go → Rust: RequestTransition (if transition ready)
service StateEngine {
  // Create and initialise a new session. Returns the session_id.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // Return current session state (called by Go before every pipeline turn).
  rpc GetSessionState(SessionQuery) returns (chitragupt.common.SessionStateProto);

  // Apply entity extractions and AC updates produced by the Python pipeline.
  rpc ApplyTurnResult(TurnResultRequest) returns (TurnResultResponse);

  // Attempt a forward phase transition. Returns approved/blocked.
  rpc RequestTransition(TransitionRequest) returns (TransitionResponse);

  // Re-enter a prior phase without clearing captured data.
  rpc RevisitPhase(RevisitRequest) returns (RevisitResponse);
}

// ---------------------------------------------------------------------------
// CreateSession
// ---------------------------------------------------------------------------

message CreateSessionRequest {
  string workspace_id = 1;
  string project_id   = 2;
}

message CreateSessionResponse {
  string session_id    = 1;
  string current_phase = 2;
}

// ---------------------------------------------------------------------------
// GetSessionState
// ---------------------------------------------------------------------------

message SessionQuery {
  string session_id   = 1;
  string workspace_id = 2; // required for RLS key construction
}

// ---------------------------------------------------------------------------
// ApplyTurnResult
// ---------------------------------------------------------------------------

message TurnResultRequest {
  string session_id                                    = 1;
  repeated chitragupt.common.EntityProto   entities   = 2;
  repeated chitragupt.common.AcUpdateProto ac_updates = 3;
  double cost_usd                                      = 4;
  int32  turn_count_delta                              = 5; // usually 1
}

message TurnResultResponse {
  string current_phase    = 1;
  bool   transition_ready = 2;
  int32  unmet_ac_count   = 3;
}

// ---------------------------------------------------------------------------
// RequestTransition
// ---------------------------------------------------------------------------

message TransitionRequest {
  string session_id   = 1;
  string target_phase = 2;
}

message TransitionResponse {
  bool   approved      = 1;
  string error_message = 2;
  string current_phase = 3; // reflects state after the call
}

// ---------------------------------------------------------------------------
// RevisitPhase
// ---------------------------------------------------------------------------

message RevisitRequest {
  string session_id   = 1;
  string target_phase = 2;
}

message RevisitResponse {
  bool   ok            = 1;
  string error_message = 2;
  string current_phase = 3;
}
